# STOPGAP. Delete this file the day `hanzoai/hanzo.ai` stops being a forge mirror.
#
# The estate rule is that CI is native: `.hanzo/workflows` on git.hanzo.ai, and
# `.github/workflows` carries sync and nothing else. That rule is right and this
# file breaks it, so here is exactly why, and exactly what retires it.
#
# hanzo.ai could not deploy AT ALL. Measured 2026-08-01:
#   - `.github/workflows/` was EMPTY, so GitHub ran nothing.
#   - `.hanzo/workflows/deploy.yml` exists, but only the forge reads that path,
#     and `git.hanzo.ai/v1/repos/hanzoai/hanzo.ai` reports `"mirror": true`.
#     A mirror is read-only: pushes are refused ("Mirror Repository … is
#     read-only") and its Actions never fire.
#   - There is no `hanzo/hanzo.ai` tenant repo (404), which is the writable half
#     `universe` has and this repo does not.
# So every commit for weeks landed somewhere nothing built, which is why the
# white-border defect and the stale nav survived several "fixes".
#
# THE REAL FIX, which needs one action this workflow cannot take: create a
# writable `hanzo/hanzo.ai` on the forge (or convert the mirror), push there, and
# `.hanzo/workflows/deploy.yml` starts firing on its own. Every forge token
# reachable from the cluster is scoped `read:repository` — `hanzo-cd-repo-creds-forge`
# answers 403 on the org — so creating it needs an admin token or the UI.
#
# Why ubuntu-latest is not the NO-GITHUB-BUILDERS violation it looks like: that
# rule is about IMAGE builds, which have their own plane (platform.hanzo.ai ->
# BuildKit in `hanzo-build`). This builds a static export and uploads it; it
# produces no image and pushes to no registry. It also cannot use the self-hosted
# pool — every runner carrying `hanzo-build-linux-amd64` is registered to
# git.hanzo.ai, not to github.com, so a job asking for that label here queues
# until it is cancelled.
name: Deploy (stopgap)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hanzo-ai
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # No `version:` — package.json's `packageManager` is the single source, and
      # pinning here as well makes the action fail outright on any mismatch
      # (ERR_PNPM_BAD_PM_VERSION) rather than picking one.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_* is inlined at build time, so the key has to be present here
      # rather than at runtime. Absent, the bundle simply ships without telemetry;
      # that is a degraded build, not a broken one, so it does not gate the deploy.
      - name: Build the static export
        run: pnpm build
        env:
          NEXT_PUBLIC_EVENT_INGEST_KEY: ${{ secrets.EVENT_INGEST_KEY }}

      # Fail before publishing rather than after: `output: export` writing an
      # empty out/ is the failure mode that silently blanks the site.
      - name: Refuse to publish an empty export
        run: |
          set -euo pipefail
          test -f out/index.html || { echo "::error::out/index.html missing — the export produced nothing"; exit 1; }
          n=$(find out -name '*.html' | wc -l)
          [ "$n" -ge 100 ] || { echo "::error::only $n html files exported; expected ~130"; exit 1; }
          echo "exported $n pages"

      # The token is exported only when it is NON-EMPTY. An absent secret still
      # yields a DEFINED env var set to the empty string, and wrangler prefers
      # CLOUDFLARE_API_TOKEN whenever it is defined — so declaring it in `env:`
      # made every run authenticate with an empty token and never fall back to
      # the email+key pair. That is what failed the first green build.
      - name: Deploy to Cloudflare Pages
        run: |
          set -euo pipefail
          if [ -n "${CF_TOKEN:-}" ]; then
            export CLOUDFLARE_API_TOKEN="$CF_TOKEN"
            echo "auth: scoped API token"
          else
            export CLOUDFLARE_EMAIL="$CF_EMAIL"
            export CLOUDFLARE_API_KEY="$CF_KEY"
            echo "auth: email + global key (mint a scoped token and set CLOUDFLARE_API_TOKEN to retire this)"
          fi
          pnpm dlx wrangler pages deploy out --project-name=hanzo-ai --branch=main --commit-dirty=true
        env:
          # wrangler prefers CLOUDFLARE_API_TOKEN and falls back to the
          # EMAIL + API_KEY pair. Both are wired so the scoped token can be
          # minted later and simply take over — no workflow change, and the
          # account-wide global key stops being used the moment it is set.
          #
          # It is set up this way because the scoped token in KMS is DEAD: it
          # answers `Invalid access token [code: 9109]`, which is why the
          # first hand-deploy had to fall back to the global key. Mint a
          # Pages-scoped token, set CLOUDFLARE_API_TOKEN, then delete
          # CLOUDFLARE_EMAIL/CLOUDFLARE_API_KEY from this repo's secrets.
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
