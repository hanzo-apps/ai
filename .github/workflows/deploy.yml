# STOPGAP. Delete this file the day `hanzoai/hanzo.ai` stops being a forge mirror.
#
# The estate rule is that CI is native: `.hanzo/workflows` on git.hanzo.ai, and
# `.github/workflows` carries sync and nothing else. That rule is right and this
# file breaks it, so here is exactly why, and exactly what retires it.
#
# hanzo.ai could not deploy AT ALL. Measured 2026-08-01:
#   - `.github/workflows/` was EMPTY, so GitHub ran nothing.
#   - `.hanzo/workflows/deploy.yml` exists, but only the forge reads that path,
#     and `git.hanzo.ai/v1/repos/hanzoai/hanzo.ai` reports `"mirror": true`.
#     A mirror is read-only: pushes are refused ("Mirror Repository … is
#     read-only") and its Actions never fire.
#   - There is no `hanzo/hanzo.ai` tenant repo (404), which is the writable half
#     `universe` has and this repo does not.
# So every commit for weeks landed somewhere nothing built, which is why the
# white-border defect and the stale nav survived several "fixes".
#
# THE REAL FIX, which needs one action this workflow cannot take: create a
# writable `hanzo/hanzo.ai` on the forge (or convert the mirror), push there, and
# `.hanzo/workflows/deploy.yml` starts firing on its own. Every forge token
# reachable from the cluster is scoped `read:repository` — `hanzo-cd-repo-creds-forge`
# answers 403 on the org — so creating it needs an admin token or the UI.
#
# Why ubuntu-latest is not the NO-GITHUB-BUILDERS violation it looks like: that
# rule is about IMAGE builds, which have their own plane (platform.hanzo.ai ->
# BuildKit in `hanzo-build`). This builds a static export and uploads it; it
# produces no image and pushes to no registry. It also cannot use the self-hosted
# pool — every runner carrying `hanzo-build-linux-amd64` is registered to
# git.hanzo.ai, not to github.com, so a job asking for that label here queues
# until it is cancelled.
# This file also runs the GATES, because it is the only thing here that runs at
# all. `hanzo.yml` declares them for the native plane and that declaration is the
# canonical one — but the forge repo is a read-only mirror, so nothing in
# `.hanzo/workflows` fires, and a gate that never executes is not a gate. The two
# stay in step until the mirror is replaced, and then this file goes and the
# declaration in `hanzo.yml` is all that is left.
name: Deploy (stopgap)

on:
  # MERGE BY PULL REQUEST, NOT BY FAST-FORWARD. Measured 2026-08-01: seven
  # commits landed on main that day and GitHub created ZERO push-event runs for
  # any of them — every run on this repo is `pull_request` or a manual
  # `workflow_dispatch`. Pushes made as the machine account this estate pushes
  # with do not trigger workflows, so `push` below is inert for the pushes this
  # box actually makes and a direct-to-main merge ships ungated. The
  # `pull_request` half does fire, and is where the gates below really run.
  # Fixing the push side is an estate-level credential change, not a change to
  # this file.
  push:
    branches: [main]
  # The gates have to run BEFORE a merge, not after it. `pull_request` is what
  # makes this a gate rather than a report; the deploy step below is guarded so a
  # pull request builds and is checked and publishes nothing.
  pull_request:
  workflow_dispatch:

concurrency:
  # Per ref, so a pull request's gate run cannot cancel main's deploy.
  group: deploy-hanzo-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # No `version:` — package.json's `packageManager` is the single source, and
      # pinning here as well makes the action fail outright on any mismatch
      # (ERR_PNPM_BAD_PM_VERSION) rather than picking one.
      - uses: pnpm/action-setup@v4

      # 22, which is now what `.nvmrc` and `engines` say as well. It was 20
      # there and 22 here, and the two reasons for 22 arrived separately:
      # wrangler 4.x refuses to start below it ("Wrangler requires at least
      # Node.js v22.0.0"), which failed the deploy step after a green build;
      # and `scripts/noindex.mjs` reads `lib/publish` directly, which needs the
      # type stripping Node does for itself from 22.18. One floor, stated once,
      # and this line no longer contradicts the file that declares it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_* is inlined at build time, so the key has to be present here
      # rather than at runtime. Absent, the bundle simply ships without telemetry;
      # that is a degraded build, not a broken one, so it does not gate the deploy.
      - name: Build the static export
        run: pnpm build
        env:
          NEXT_PUBLIC_EVENT_INGEST_KEY: ${{ secrets.EVENT_INGEST_KEY }}

      # "Refuse to publish a short export" used to be a shell step here, with a
      # hand-kept page count in it. It is now `requireExport()` in
      # e2e/gates/export.ts, stated ONCE and against the App Router tree rather
      # than against a number somebody has to remember to raise: every route the
      # tree answers must have shipped a page. It has to live there anyway —
      # every gate in the suite asserts "no page does X", which an export with
      # three pages in it satisfies trivially — and the gates run below, before
      # the deploy step, so nothing publishes ahead of the check.
      #
      # The gates read `out/`, so they run here rather than in a job of their
      # own: one build, gated once, and the bytes checked are the bytes that
      # publish. Both defects they catch were invisible in the source that
      # produced them — `lineHeight={1.1}` reads as a ratio and compiles to
      # `line-height: 1.1px`, and a page nothing links to is still written into
      # sitemap.xml — so the export is the only honest subject.
      - name: Install the browser the gates measure in
        run: pnpm exec playwright install --with-deps chromium

      - name: Gates
        run: pnpm gates

      # The token is exported only when it is NON-EMPTY. An absent secret still
      # yields a DEFINED env var set to the empty string, and wrangler prefers
      # CLOUDFLARE_API_TOKEN whenever it is defined — so declaring it in `env:`
      # made every run authenticate with an empty token and never fall back to
      # the email+key pair. That is what failed the first green build.
      - name: Deploy to Cloudflare Pages
        # main only. A pull request runs everything above this line and stops,
        # which is the whole point of it being one job.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ -n "${CF_TOKEN:-}" ]; then
            export CLOUDFLARE_API_TOKEN="$CF_TOKEN"
            echo "auth: scoped API token"
          else
            export CLOUDFLARE_EMAIL="$CF_EMAIL"
            export CLOUDFLARE_API_KEY="$CF_KEY"
            echo "auth: email + global key (mint a scoped token and set CLOUDFLARE_API_TOKEN to retire this)"
          fi
          pnpm dlx wrangler pages deploy out --project-name=hanzo-ai --branch=main --commit-dirty=true
        env:
          # wrangler prefers CLOUDFLARE_API_TOKEN and falls back to the
          # EMAIL + API_KEY pair. Both are wired so the scoped token can be
          # minted later and simply take over — no workflow change, and the
          # account-wide global key stops being used the moment it is set.
          #
          # It is set up this way because the scoped token in KMS is DEAD: it
          # answers `Invalid access token [code: 9109]`, which is why the
          # first hand-deploy had to fall back to the global key. Mint a
          # Pages-scoped token, set CLOUDFLARE_API_TOKEN, then delete
          # CLOUDFLARE_EMAIL/CLOUDFLARE_API_KEY from this repo's secrets.
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
