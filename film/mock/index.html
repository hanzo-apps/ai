<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"archetype","type":"enum","label":"Surface","default":"terminal","options":[
      {"value":"terminal","label":"Terminal"},
      {"value":"dashboard","label":"Dashboard"},
      {"value":"table","label":"Table"},
      {"value":"chat","label":"Chat"},
      {"value":"editor","label":"Editor"},
      {"value":"graph","label":"Graph"},
      {"value":"grid","label":"Grid"}
    ]},
    {"id":"accent","type":"color","label":"Accent","default":"#8b5cf6"},
    {"id":"seed","type":"number","label":"Seed","default":1},
    {"id":"slug","type":"string","label":"Slug","default":"preview"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>product mockup</title>
    <script src="assets/gsap.min.js"></script>
    <script src="assets/mock.js"></script>
    <script src="assets/kit.js"></script>
    <link rel="stylesheet" href="assets/ui.css" />
  </head>
  <body>
    <div
      id="root"
      data-composition-id="mockup"
      data-start="0"
      data-duration="6"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage" class="stage clip" data-start="0" data-duration="6" data-track-index="0">
        <div class="grid-lines"></div>
      </div>

      <div id="app" class="app clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="bar">
          <span class="dot a"></span><span class="dot"></span><span class="dot"></span>
          <span id="crumb" class="pill" style="width: 300px"></span>
        </div>
        <div class="body">
          <div id="main" class="main"></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var v = vars();
        var root = document.getElementById("root");
        root.style.setProperty("--accent", v.accent || "#8b5cf6");

        var tl = gsap.timeline({ paused: true });
        var ctx = {
          app: document.getElementById("app"),
          main: document.getElementById("main"),
          r: rng(v.seed || 1),
          tl: tl,
          dur: 6,
        };

        (KIT[v.archetype] || KIT.terminal)(ctx);

        window.__timelines = window.__timelines || {};
        window.__timelines["mockup"] = tl;
      })();
    </script>
  </body>
</html>
