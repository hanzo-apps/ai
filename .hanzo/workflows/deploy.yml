name: deploy
# hanzo.ai is a SITE, not an App.
#
# It is a Next.js `output: export` — 759 pages of HTML that never execute. This
# file used to build a container image (ghcr.io/hanzoai/hanzo-ai-www) so that
# ghcr.io/hanzoai/static could serve those files behind hanzoai/ingress: an image
# build, a registry push, a tag pinned into an App CR in hanzoai/universe, and two
# replicas of a pod — all to hand back bytes. The Sites plane exists for this
# exact shape.
#
#   pnpm build -> out/
#     -> POST /v1/projects/hanzo-ai/deploy    (202, queued; returns an upload grant)
#     -> POST the objects straight to S3      (the bytes skip the API)
#     -> POST .../deployments/<id>/complete   (live, and prunes what the build dropped)
#
# WHERE THINGS FIT, since these are orthogonal:
#   Project  — IAM-owned, the billing bucket. One project holds many sites.
#   Site     — this. /v1/projects/:slug/deploy. Static, no compute.
#   Function — /v1/functions. Per-request compute, no server.
#   App      — an App CR the operator reconciles. Long-running containers.
# A marketing export is the second and only the second.
#
# THIS RETIRED THE THIRD PIPELINE. hanzo.ai had three ways to publish one
# directory: this file (image; green, and pinned by nothing — the App CR's tag is
# still the literal REPLACE-WITH-FIRST-PUBLISHED-SHA), .github/workflows/deploy.yml
# (Cloudflare Pages — the only one that actually served), and a k8s plane staged
# behind a DNS move that never happened. The one doing the work was the one the
# estate rule forbids. Now there is one, and it is this.
#
# NOT the same lane as cloud.hanzo.ai. That host is ghcr.io/hanzoai/cloud-www,
# built by cloud.yml from Dockerfile.production out of this same tree. It is
# untouched: a static export and a promoted image are different products of one
# build, and only the apex moved.
#
# The mechanics of the publish are NOT here — they are bin/site in hanzoai/ci,
# because hips, logo, flow and gallery need the identical calls and a contract
# transcribed per repo is a contract that drifts.
# A DAILY RUN, because part of this site is not in this repo. The model pages are
# a static export of the live catalog — /models, every lab page and every model
# page are generated from what models.hanzo.ai answers at BUILD time, and the
# page says so in its own copy ("prices and context windows come from the live
# catalog"). The catalog changes without anyone touching this tree, so a build
# only on push means the promise is kept exactly until the next model ships.
# `revalidate` cannot cover it: `output: 'export'` leaves no runtime to revalidate
# in, and the per-model routes come from generateStaticParams, so a page for a new
# model cannot exist until a build makes it.
on:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel a publish in flight: a half-uploaded prefix is a broken site.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    # NOT ubuntu-latest. Every runner carrying this label is registered to
    # git.hanzo.ai, which is what reads .hanzo/workflows; a job asking for it on
    # github.com is never assigned and cancels at the 24h timeout.
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # No `version:` — package.json's `packageManager` is the single source, and
      # naming it here too makes action-setup fail outright on a mismatch
      # ("Multiple versions of pnpm specified") rather than picking one.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No key is fetched here any more. It is DECLARED, in app/providers.tsx and
      # as the Dockerfile's ARG default, because a publishable key ships in the
      # client bundle by construction — it is site identity, not a secret, and a
      # value every visitor already holds gains nothing from a lookup.
      #
      # Fetching it was itself the defect. deploy/PUBLISHABLE_KEY is one shared
      # ORG key, and only lanes that remember to read AND pass it produce a keyed
      # artifact — cloud.yml named its site alone. A declared key reaches all
      # six lanes, including the ones nobody edits.
      #
      # It is also the wrong key to want: cloud files a PROJECT key's events with
      # product=hanzo-ai and the org-wide pk-live-* key's with product empty, so
      # the shared key costs attribution that the project key keeps.

      # 759 pages; the default heap OOMs it.
      - name: Build the static export
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        timeout-minutes: 30

      # The gate that matters, and the only one that survives a lane nobody
      # remembers: assert the SHIPPING BYTES carry a usable key. Checking a
      # variable proves only that a value was in scope; this reads the export.
      #
      # Source-agnostic on purpose — declared default, env override or build arg
      # all satisfy it, and none of them satisfies it by accident. What it
      # refuses is the artifact that actually broke: a bundle with no pk- key,
      # whose every anonymous POST /v1/event answers 401 ingest_key_required,
      # dropping all pageviews and errors and logging a console error per visit.
      #
      # It does NOT prove the key resolves — a deleted project still answers 403,
      # which is how the live 403 shipped. That is checked against the door after
      # deploy, not here.
      - name: Prove a publishable key reached the bundle
        run: |
          set -euo pipefail
          if ! grep -rqE 'pk-[A-Za-z0-9_-]{20,}' out/_next/static; then
            echo "::error::no pk- publishable key is present in out/_next/static — the bundle would 401 every anonymous event; refusing to ship"; exit 1
          fi
          echo "publishable key present in the export"

      # A shape check cannot catch the failure that actually shipped. The bundle
      # carried pk-live-c886…, correctly formed and inlined — every gate above
      # passes it — but its project had been deleted, so the door answered 403
      # ingest_key_unknown and the site lost 100% of its events while looking
      # healthy from inside the build.
      #
      # Only the door knows. Ask it, with the key the export actually carries
      # rather than the one this job believes it used, and refuse to publish
      # anything it will not accept. 401 means the key is unreadable, 403 means
      # no project answers to it; both ship a site that measures nothing.
      - name: Prove the key the bundle carries still resolves at the door
        run: |
          set -euo pipefail
          key=$(grep -rhoE 'pk-[A-Za-z0-9_-]{20,}' out/_next/static | sort -u | head -1)
          ask() {
            curl -s -m 20 -o /tmp/door.json -w '%{http_code}' \
              -X POST "https://api.hanzo.ai/v1/event?ingest_key=${key}" \
              -H 'content-type: application/json' -d '{"batch":[]}'
          }
          # A 5xx is the door being unreachable, which says nothing about the
          # key. Ask again before believing it.
          for wait in 0 10 30 60; do
            [ "$wait" = 0 ] || sleep "$wait"
            code=$(ask)
            case "$code" in 200|401|403) break ;; esac
          done
          case "$code" in
            200) echo "door accepted the bundle's key (200)" ;;
            401|403)
              echo "::error::the key in this bundle does not resolve: the door answered ${code}. $(cat /tmp/door.json)"
              echo "::error::publishing would ship a site that loses every event; refusing"
              exit 1 ;;
            *)
              echo "::error::the door is down — api.hanzo.ai answered ${code} to four tries over 100s. $(cat /tmp/door.json)"
              echo "::error::the key is unverified, not refused; this is an outage, not a bad bundle"
              exit 1 ;;
          esac

      # The gates run in the job that PUBLISHES, because that is the only placement
      # that makes "nothing publishes ungated" true: workflows sharing a trigger do
      # not order themselves, so a red gate in cicd.yml cannot stop a publish here.
      #
      # They now read the EXACT bytes that ship. That was not true before: the
      # gates checked this job's `out/`, while the image was built by a second
      # `pnpm build` inside the Dockerfile — same command, different invocation.
      # Uploading this `out/` closes that gap by construction.
      #
      # Both defects they catch are invisible in the source that produced them —
      # `lineHeight={1.1}` reads as a ratio and compiles to `line-height: 1.1px`,
      # and a page nothing links to is still written into sitemap.xml — so the
      # export is the only honest subject. requireExport() derives "every route
      # shipped a page" from the App Router tree, so no hand-kept page count has to
      # be remembered.
      - name: Install the browser the gates measure in
        run: pnpm exec playwright install --with-deps chromium

      - name: Gates
        run: pnpm gates

      # THE DEPLOY KEY IS READ FROM KMS, WHICH IS WHERE A SECRET LIVES — and the
      # reading is the action's, not this file's. It was `secrets.HANZO_DEPLOY_TOKEN`,
      # an org-level forge secret holding an `sk-` key that resolves to no
      # principal, so cloud answered 403 on every call and the publish was the one
      # red step under 48 green gates. This file then grew its own KMS read, which
      # fixed hanzo.ai and left hips, hanzo.app and agency on the dead secret. So
      # the read lives with the publish it serves, and every site rotates together.
      #
      # ONE credential. The 202 carries a prefix-scoped, 30-minute presigned POST
      # grant, so nothing here holds a bucket key. Do NOT add SITES_S3_* — that is
      # the standing shared-bucket credential the grant replaced, and it could
      # overwrite every other org's site.
      - name: Publish to the Sites plane
        uses: hanzoai/ci/.github/actions/site@v1
        with:
          slug: hanzo-ai
          dir: out
          jobs: '48'
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
