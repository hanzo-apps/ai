name: deploy
# hanzo.ai is a SITE, not an App.
#
# It is a Next.js `output: export` — 759 pages of HTML that never execute. This
# file used to build a container image (ghcr.io/hanzoai/hanzo-ai-www) so that
# ghcr.io/hanzoai/static could serve those files behind hanzoai/ingress: an image
# build, a registry push, a tag pinned into an App CR in hanzoai/universe, and two
# replicas of a pod — all to hand back bytes. The Sites plane exists for this
# exact shape.
#
#   pnpm build -> out/
#     -> POST /v1/projects/hanzo-ai/deploy    (202, queued; returns an upload grant)
#     -> POST the objects straight to S3      (the bytes skip the API)
#     -> POST .../deployments/<id>/complete   (live, and prunes what the build dropped)
#
# WHERE THINGS FIT, since these are orthogonal:
#   Project  — IAM-owned, the billing bucket. One project holds many sites.
#   Site     — this. /v1/projects/:slug/deploy. Static, no compute.
#   Function — /v1/functions. Per-request compute, no server.
#   App      — an App CR the operator reconciles. Long-running containers.
# A marketing export is the second and only the second.
#
# THIS RETIRED THE THIRD PIPELINE. hanzo.ai had three ways to publish one
# directory: this file (image; green, and pinned by nothing — the App CR's tag is
# still the literal REPLACE-WITH-FIRST-PUBLISHED-SHA), .github/workflows/deploy.yml
# (Cloudflare Pages — the only one that actually served), and a k8s plane staged
# behind a DNS move that never happened. The one doing the work was the one the
# estate rule forbids. Now there is one, and it is this.
#
# NOT the same lane as cloud.hanzo.ai. That host is ghcr.io/hanzoai/cloud-www,
# built by cloud.yml from Dockerfile.production out of this same tree. It is
# untouched: a static export and a promoted image are different products of one
# build, and only the apex moved.
#
# The mechanics of the publish are NOT here — they are bin/sitedeploy in
# hanzoai/ci, because hanzo.app, hips and computer need the identical three calls
# and a contract transcribed per repo is a contract that drifts.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel a publish in flight: a half-uploaded prefix is a broken site.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    # NOT ubuntu-latest. Every runner carrying this label is registered to
    # git.hanzo.ai, which is what reads .hanzo/workflows; a job asking for it on
    # github.com is never assigned and cancels at the 24h timeout.
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # No `version:` — package.json's `packageManager` is the single source, and
      # naming it here too makes action-setup fail outright on a mismatch
      # ("Multiple versions of pnpm specified") rather than picking one.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # BEFORE the build: NEXT_PUBLIC_* is inlined into the bundle at build time,
      # so a key fetched afterwards never reaches the artifact.
      #
      # deploy/PUBLISHABLE_KEY is the ONE name and the ONE location, shared with
      # hanzo.app and hanzo.chat. It is per-ORG, not per-property: one pk- resolves
      # the org for every surface, and the SDK's `product` field is what separates
      # them in the warehouse.
      - name: Fetch the ingest key from KMS
        id: kms
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://api.hanzo.ai' }}
          # No KMS_ORG: the embedded plane resolves the tenant from the token's own
          # claim, so an org named in config could only ever disagree with the one
          # actually served.
          KMS_SECRET_ENV: ${{ vars.KMS_SECRET_ENV || 'prod' }}
        run: |
          set -euo pipefail
          token=$(curl -fsS "${KMS_ENDPOINT}/v1/kms/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"${KMS_CLIENT_ID}\",\"clientSecret\":\"${KMS_CLIENT_SECRET}\"}" \
            | jq -r '.accessToken // empty')
          if [ -z "${token}" ]; then
            echo "::error::KMS login failed at ${KMS_ENDPOINT}/v1/kms/auth/login"; exit 1
          fi
          # KMS is embedded in hanzoai/cloud (HIP-0106), so the surface is FLAT and
          # the org comes from the TOKEN, not the URL. The old
          # /v1/kms/orgs/<org>/secrets/... shape 404s here, and a 404 read through
          # `|| true` is indistinguishable from an absent secret.
          key=$(curl -fsS "${KMS_ENDPOINT}/v1/kms/secrets/deploy/PUBLISHABLE_KEY?env=${KMS_SECRET_ENV}" \
            -H "Authorization: Bearer ${token}" | jq -r '.value // empty' || true)
          # No key is NO SHIP. This used to warn and build anyway, on the premise
          # that keyless traffic still landed under a $public tenant with a 200.
          # That lane is retired (cloud apps/analytics/public.go): a credential-less
          # POST /v1/event now answers 401 ingest_key_required, so a keyless bundle
          # drops every anonymous pageview and error AND ships a console error to
          # every visitor — the exact defect measured live. cloud matches `pk-`
          # only; another prefix is not read as a key, so it is the same refusal.
          # hanzo.app's release lane already refuses the same way.
          case "${key}" in
            '')   echo "::error::deploy/PUBLISHABLE_KEY absent from KMS — a keyless bundle 401s every anonymous event; refusing to ship"; exit 1 ;;
            pk-*) echo "::add-mask::${key}"; echo "key=${key}" >> "$GITHUB_OUTPUT" ;;
            *)    echo "::error::deploy/PUBLISHABLE_KEY does not begin with 'pk-' — cloud would not read it as a key; refusing to ship"; exit 1 ;;
          esac

      # 759 pages; the default heap OOMs it.
      - name: Build the static export
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          NEXT_PUBLIC_PUBLISHABLE_KEY: ${{ steps.kms.outputs.key }}
        timeout-minutes: 30

      # Prove the key was INLINED, not merely fetched — the same proof the
      # Dockerfile lane runs. The step above can only fail loudly now, but the
      # output plumbing between it and the build cannot: an empty
      # `steps.kms.outputs.key` builds green and ships the keyless bundle whose
      # every anonymous event 401s.
      - name: Prove the ingest key reached the bundle
        env:
          NEXT_PUBLIC_PUBLISHABLE_KEY: ${{ steps.kms.outputs.key }}
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_PUBLISHABLE_KEY}" ]; then
            echo "::error::the fetched key never left the KMS step — refusing to ship"; exit 1
          fi
          if ! grep -rqF "${NEXT_PUBLIC_PUBLISHABLE_KEY}" out/_next/static; then
            echo "::error::the ingest key is NOT in out/_next/static — the bundler did not inline it; refusing to ship"; exit 1
          fi

      # The gates run in the job that PUBLISHES, because that is the only placement
      # that makes "nothing publishes ungated" true: workflows sharing a trigger do
      # not order themselves, so a red gate in cicd.yml cannot stop a publish here.
      #
      # They now read the EXACT bytes that ship. That was not true before: the
      # gates checked this job's `out/`, while the image was built by a second
      # `pnpm build` inside the Dockerfile — same command, different invocation.
      # Uploading this `out/` closes that gap by construction.
      #
      # Both defects they catch are invisible in the source that produced them —
      # `lineHeight={1.1}` reads as a ratio and compiles to `line-height: 1.1px`,
      # and a page nothing links to is still written into sitemap.xml — so the
      # export is the only honest subject. requireExport() derives "every route
      # shipped a page" from the App Router tree, so no hand-kept page count has to
      # be remembered.
      - name: Install the browser the gates measure in
        run: pnpm exec playwright install --with-deps chromium

      - name: Gates
        run: pnpm gates

      # ONE credential. The 202 carries a prefix-scoped, 30-minute presigned POST
      # grant, so nothing here holds a bucket key. Do NOT add SITES_S3_* — that is
      # the standing shared-bucket credential the grant replaced, and it could
      # overwrite every other org's site.
      - name: Publish to the Sites plane
        uses: hanzoai/ci/.github/actions/sitedeploy@v1
        with:
          slug: hanzo-ai
          dir: out
          jobs: '48'
        env:
          HANZO_DEPLOY_TOKEN: ${{ secrets.HANZO_DEPLOY_TOKEN }}
