name: Deploy
# THE pipeline that ships hanzo.ai to Cloudflare Pages. There is no longer a
# second one: .github/workflows/deploy.yml is deleted, not neutralized.
#
# WHY THIS EXISTS: GitHub Actions is disabled for the `hanzo-dev` ACCOUNT, so a
# push by that account creates ZERO runs there — no queued job, no failed run,
# no notification. The repo's own Actions setting is `enabled: true`, which is
# why that looked healthy while nothing shipped. Eleven commits sat undeployed
# for a day and hanzo.ai kept serving "the open-source AI cloud" after that
# claim was deliberately removed in e31324eb.
#
# WHY THE OTHER COPY IS GONE rather than kept as a fallback: it could not be
# one. Gitea collects workflows from the FIRST of WORKFLOW_DIRS that exists in
# the pushed commit and ignores the rest (modules/actions/workflows.go,
# listWorkflowsInDirs breaks on the first hit), so from the moment this file
# existed the entire .github/workflows directory was dark on this forge. Its
# deploy.yml also ran on `hanzo-apps-build-linux-amd64`, an ARC scale set
# decommissioned on 2026-07-27; its last runs are queued and cancelled, never
# completed. Two copies of a deploy where only one can run is how a fix gets
# written into the half that cannot ship it.
#
# The smoke test below has caught real breakage before and is not decoration.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4

      # No `version:` input on purpose. package.json pins
      # packageManager: pnpm@9.15.0, and action-setup ERRORS OUT if a version is
      # given in both places ("Multiple versions of pnpm specified"). One source
      # of truth — package.json — so local, this pipeline and the GitHub one can
      # never resolve different pnpm binaries.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every secret this job needs, read once, BEFORE the build. The ordering is
      # load-bearing for the two telemetry values: they are NEXT_PUBLIC_*, so Next
      # inlines them into the bundle at build time and nothing set afterwards can
      # reach it. Fetching them after the build — where the CF read used to sit —
      # cannot wire them no matter what KMS holds.
      #
      # Two secret roots, two failure policies:
      #   deploy/  CF credentials. REQUIRED — without them there is no deploy.
      #   site/    the ingest key. FAIL-SOFT — anonymous traffic is still admitted
      #            without it, so an absent secret degrades telemetry rather than
      #            blocking the site. It warns, so "never provisioned" cannot read
      #            as "working".
      #
      # ONE credential, because there is one door. @hanzo/event also accepts a
      # Sentry `dsn` for a second, independently authenticated send to
      # /v1/sentry/<projectId> — but sentry.hanzo.ai does not read that store. Its
      # shell reads GET /v1/errors, i.e. the type:'error' events in hanzo.events
      # that this key already writes through /v1/event (universe
      # infra/k8s/ingress/routes.yaml). A DSN here would provision a second
      # publishable credential to fill a store the dashboard never opens.
      #
      # The path segment is load-bearing: querying the org secret root returns
      # {"names":[]} and looks empty, which reads as "the creds are gone".
      - name: Fetch secrets from KMS
        id: kms
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://kms.hanzo.ai' }}
          KMS_ORG: ${{ vars.KMS_ORG || 'hanzo' }}
          KMS_SECRET_ENV: ${{ vars.KMS_SECRET_ENV || 'prod' }}
        run: |
          token=$(curl -fsS "${KMS_ENDPOINT}/v1/kms/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"${KMS_CLIENT_ID}\",\"clientSecret\":\"${KMS_CLIENT_SECRET}\"}" \
            | jq -r '.accessToken // empty')
          if [ -z "${token}" ]; then
            echo "::error::KMS login failed at ${KMS_ENDPOINT}/v1/kms/auth/login (check KMS_CLIENT_ID/KMS_CLIENT_SECRET)."
            exit 1
          fi
          kms_get() {
            curl -fsS "${KMS_ENDPOINT}/v1/kms/orgs/${KMS_ORG}/secrets/$1/$2?env=${KMS_SECRET_ENV}" \
              -H "Authorization: Bearer ${token}" | jq -r '.secret.value // empty' || true
          }

          cf_token=$(kms_get deploy CLOUDFLARE_API_TOKEN)
          cf_account=$(kms_get deploy CLOUDFLARE_ACCOUNT_ID)
          if [ -z "${cf_token}" ] || [ -z "${cf_account}" ]; then
            echo "::error::CF credentials missing in KMS at ${KMS_ORG}/deploy (env ${KMS_SECRET_ENV})."
            exit 1
          fi
          echo "::add-mask::${cf_token}"
          echo "::add-mask::${cf_account}"
          echo "cf_token=${cf_token}" >> "$GITHUB_OUTPUT"
          echo "cf_account=${cf_account}" >> "$GITHUB_OUTPUT"

          # Refuse a wrong prefix rather than ship it: cloud matches `pk-`, and a
          # `pk_` value is not recognized as publishable and is not "presented"
          # either, so it does not 403 — it misfiles to $public silently.
          key=$(kms_get site HANZO_INGEST_KEY)
          case "${key}" in
            '')   echo "::warning::site/HANZO_INGEST_KEY absent — logged-out traffic lands under \$public, which our org cannot read, and the anonymous allowlist drops every @hanzo/observe interaction. Mint: POST /v1/ingest/keys" ;;
            pk-*) echo "::add-mask::${key}"; echo "key=${key}" >> "$GITHUB_OUTPUT" ;;
            *)    echo "::warning::site/HANZO_INGEST_KEY does not begin with 'pk-'; ignoring it, because a wrong prefix misfiles to \$public silently." ;;
          esac

      # Large static export (hundreds of pages); the default heap OOMs it.
      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          NEXT_PUBLIC_HANZO_INGEST_KEY: ${{ steps.kms.outputs.key }}
        timeout-minutes: 30

      # No SPA fallback: every dynamic segment ships generateStaticParams, so
      # `output: export` emits real HTML per route. Do NOT reintroduce
      # `cp out/index.html out/404.html` — that clobbered the export's real 404
      # with the homepage, so every broken inbound link answered 404 while
      # rendering "What can I help with?", indistinguishable from a good visit.
      - name: Smoke test static build
        run: |
          pnpm dlx serve out -l 3333 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3333 2>/dev/null; then
              echo "Server ready after ${i}s"; break
            fi
            sleep 1
          done
          BODY=$(curl -s http://localhost:3333)
          if echo "$BODY" | grep -q "Application error"; then
            echo "FATAL: Homepage contains 'Application error'"; kill $SERVER_PID 2>/dev/null; exit 1
          fi
          FAILED=0
          for page in index about pricing contact enterprise zen; do
            if [ ! -f "out/${page}.html" ] && [ ! -f "out/${page}/index.html" ]; then
              echo "FATAL: Missing page: ${page}"; FAILED=1
            fi
          done
          kill $SERVER_PID 2>/dev/null
          if [ "$FAILED" = "1" ]; then exit 1; fi
          echo "All smoke tests passed"

      # On main, wrangler publishes to PRODUCTION (the apex), not a preview.
      # Scope is the apex only: cloud.hanzo.ai is k8s hanzoai/static and a Pages
      # deploy cannot reach it.
      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler pages deploy out --project-name=hanzo-ai --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.kms.outputs.cf_token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.kms.outputs.cf_account }}
