name: Deploy
# THE pipeline that ships hanzo.ai. It publishes ghcr.io/hanzoai/hanzo-ai-www,
# served by ghcr.io/hanzoai/static behind hanzoai/ingress — the same mechanism as
# cloud.hanzo.ai, ui.hanzo.ai and papers.hanzo.ai. Cloudflare Pages is gone.
# There is no second pipeline: .github/workflows/deploy.yml is deleted, not
# neutralized.
#
# WHY THIS EXISTS: GitHub Actions is disabled for the `hanzo-dev` ACCOUNT, so a
# push by that account creates ZERO runs there — no queued job, no failed run,
# no notification. The repo's own Actions setting is `enabled: true`, which is
# why that looked healthy while nothing shipped. Eleven commits sat undeployed
# for a day and hanzo.ai kept serving "the open-source AI cloud" after that
# claim was deliberately removed in e31324eb.
#
# WHY THE OTHER COPY IS GONE rather than kept as a fallback: it could not be
# one. Gitea collects workflows from the FIRST of WORKFLOW_DIRS that exists in
# the pushed commit and ignores the rest (modules/actions/workflows.go,
# listWorkflowsInDirs breaks on the first hit), so from the moment this file
# existed the entire .github/workflows directory was dark on this forge. Its
# deploy.yml also ran on `hanzo-apps-build-linux-amd64`, an ARC scale set
# decommissioned on 2026-07-27; its last runs are queued and cancelled, never
# completed. Two copies of a deploy where only one can run is how a fix gets
# written into the half that cannot ship it.
#
# The smoke test below has caught real breakage before and is not decoration.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4

      # No `version:` input on purpose. package.json pins
      # packageManager: pnpm@9.15.0, and action-setup ERRORS OUT if a version is
      # given in both places ("Multiple versions of pnpm specified"). One source
      # of truth — package.json — so local, this pipeline and the GitHub one can
      # never resolve different pnpm binaries.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs before the build because NEXT_PUBLIC_EVENT_INGEST_KEY is inlined into
      # the bundle at build time.
      #
      #   deploy/  CF credentials. Required; no credentials, no deploy.
      #   deploy/  the ingest key. Absent, cloud still admits pageviews under
      #            $public — but drops every track/identify/group and answers 200
      #            anyway, so the step shouts and the build ships.
      #
      # The path segment is required: the org secret root returns {"names":[]}.
      - name: Fetch secrets from KMS
        id: kms
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://api.hanzo.ai' }}
          # No KMS_ORG: the embedded plane resolves the tenant from the token's
          # own claim, so an org named in config could only ever disagree with
          # the one that is actually served.
          KMS_SECRET_ENV: ${{ vars.KMS_SECRET_ENV || 'prod' }}
        run: |
          token=$(curl -fsS "${KMS_ENDPOINT}/v1/kms/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"${KMS_CLIENT_ID}\",\"clientSecret\":\"${KMS_CLIENT_SECRET}\"}" \
            | jq -r '.accessToken // empty')
          if [ -z "${token}" ]; then
            echo "::error::KMS login failed at ${KMS_ENDPOINT}/v1/kms/auth/login (check KMS_CLIENT_ID/KMS_CLIENT_SECRET)."
            exit 1
          fi
          # KMS is embedded in hanzoai/cloud now (HIP-0106, apps/kms), so the
          # canonical surface is api.hanzo.ai/v1/kms and the contract changed in
          # two ways that both fail SILENTLY against the old standalone shape:
          #
          #   url    /v1/kms/secrets/<path>/<name>   — the org comes from the
          #          token, NOT the url. The old /v1/kms/orgs/<org>/secrets/...
          #          form 404s here; a 404 through `|| true` reads as "absent".
          #   body   {"name","env","value"}          — flat. The old
          #          `.secret.value` selects nothing and yields "".
          #
          # Either mistake produces an empty key, and an empty key is exactly
          # what the `''` case below treats as "never minted" — so a misparse is
          # indistinguishable from a missing secret. Hence both are pinned here.
          kms_get() {
            curl -fsS "${KMS_ENDPOINT}/v1/kms/secrets/$1/$2?env=${KMS_SECRET_ENV}" \
              -H "Authorization: Bearer ${token}" | jq -r '.value // empty' || true
          }

          # No Cloudflare credentials are read any more. This job used to fetch
          # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID and hard-fail without
          # them; the apex now publishes an image to GHCR, so the only credential
          # it needs is GH_PAT. Those two KMS entries can be retired once no other
          # property reads them.

          # cloud matches `pk-`; another prefix is not read as a key and misfiles
          # to $public without a 403, so refuse it here.
          #
          # deploy/EVENT_INGEST_KEY is the ONE name and the ONE location, shared with
          # hanzo.chat and hanzo.app and with the `build_secrets` default path of the
          # shared hanzoai/ci reusable. It was site/HANZO_INGEST_KEY, a per-property
          # name for a key that is per-ORG: one pk- resolves the org for every
          # property, and the SDK's `product` field is what separates them in the data.
          key=$(kms_get deploy EVENT_INGEST_KEY)
          case "${key}" in
            '')   echo "::error::deploy/EVENT_INGEST_KEY absent — traffic lands under \$public, which admits only pageview and error: every track/identify/group is dropped and still answered 200. Mint: POST /v1/keys {\"type\":\"publishable\"}" ;;
            pk-*) echo "::add-mask::${key}"; echo "key=${key}" >> "$GITHUB_OUTPUT" ;;
            *)    echo "::error::deploy/EVENT_INGEST_KEY does not begin with 'pk-'; ignoring it." ;;
          esac

      # Large static export (hundreds of pages); the default heap OOMs it.
      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          NEXT_PUBLIC_EVENT_INGEST_KEY: ${{ steps.kms.outputs.key }}
        timeout-minutes: 30

      # No SPA fallback: every dynamic segment ships generateStaticParams, so
      # `output: export` emits real HTML per route. Do NOT reintroduce
      # `cp out/index.html out/404.html` — that clobbered the export's real 404
      # with the homepage, so every broken inbound link answered 404 while
      # rendering "What can I help with?", indistinguishable from a good visit.
      - name: Smoke test static build
        run: |
          pnpm dlx serve out -l 3333 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3333 2>/dev/null; then
              echo "Server ready after ${i}s"; break
            fi
            sleep 1
          done
          BODY=$(curl -s http://localhost:3333)
          if echo "$BODY" | grep -q "Application error"; then
            echo "FATAL: Homepage contains 'Application error'"; kill $SERVER_PID 2>/dev/null; exit 1
          fi
          FAILED=0
          for page in index about pricing contact enterprise zen; do
            if [ ! -f "out/${page}.html" ] && [ ! -f "out/${page}/index.html" ]; then
              echo "FATAL: Missing page: ${page}"; FAILED=1
            fi
          done
          kill $SERVER_PID 2>/dev/null
          if [ "$FAILED" = "1" ]; then exit 1; fi
          echo "All smoke tests passed"

      # The apex ships as an IMAGE, like every other Hanzo static surface.
      #
      # This replaced `wrangler pages deploy out --project-name=hanzo-ai`. hanzo.ai
      # was the last site on Cloudflare Pages while its own siblings — cloud.hanzo.ai
      # (ghcr.io/hanzoai/cloud-www), ui.hanzo.ai, papers.hanzo.ai — already served
      # from ghcr.io/hanzoai/static behind hanzoai/ingress. Two serving mechanisms
      # for one static export meant two failure modes, two credentials, and a host
      # whose rollback story was a third party's dashboard.
      #
      # A build never deploys itself: this publishes the image and stops. A human
      # sets spec.image.tag on the App CR in hanzoai/universe, which is the one live
      # thing that says which build serves.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (GH_PAT — the instance token is not valid at ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: hanzo-dev
          password: ${{ secrets.GH_PAT }}

      - name: Build and push the apex image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ghcr.io/hanzoai/hanzo-ai-www:sha-${{ github.sha }}
          provenance: false
          push: true
          # EVENT_INGEST_KEY, and `.outputs.key`. Both names were wrong and both
          # failed silently, which is how the pair survived: Actions substitutes
          # an unknown step output with the empty string, and BuildKit warns then
          # ignores a build-arg the Dockerfile declares no ARG for. The step above
          # fetched the key and shouts three different ways when it is absent —
          # and then this line dropped it twice, so the image shipped with
          # NEXT_PUBLIC_EVENT_INGEST_KEY="" and cloud filed the apex's traffic
          # under $public, where every track/identify/group is discarded and still
          # answered 200. A green deploy with no telemetry, and nothing to read
          # that said so.
          #
          # The Dockerfile owns the NEXT_PUBLIC_ prefix (`ENV
          # NEXT_PUBLIC_EVENT_INGEST_KEY=$EVENT_INGEST_KEY`), because that prefix
          # is a property of the bundler and not of the secret.
          # `deploy/EVENT_INGEST_KEY` is the name in KMS and it stays the name here.
          #
          # e2e/gates/deploy.spec.ts holds both halves: a step output no step
          # writes, and a build-arg naming no ARG, are each a red gate now.
          build-args: |
            EVENT_INGEST_KEY=${{ steps.kms.outputs.key }}

      # build-push-action can exit 0 before the manifest resolves, so a green run
      # could still leave a CR pinned to a tag that ImagePullBackOffs. Prove it
      # pulls before the job goes green — same gate cloud.yml carries.
      - name: Verify the pushed image resolves
        run: |
          set -euo pipefail
          img="ghcr.io/hanzoai/hanzo-ai-www:sha-${{ github.sha }}"
          docker buildx imagetools inspect "$img" >/dev/null
          echo "resolves: $img"
