name: Team

# Builds ghcr.io/hanzoai/team-www — the image hanzo.team's apex serves, pinned by
# charts/app/values/hanzo/team-www.yaml in the universe repo. Static export via
# the Dockerfile, served by ghcr.io/hanzoai/static.
#
# Same lane as cloud.yml with one word changed. SURFACE names which site this
# image is: it picks the exported page that becomes index.html — here the
# app/(marketing)/team page already served at hanzo.ai/team — and the brand the
# bar wears on it. One repo, one build, every marketing host.
#
# Named team-www (matching the Deployment `team-www`) so it can never collide
# with ghcr.io/hanzoai/team, the Go backend, or ghcr.io/hanzoai/team-docs, the
# product manual on docs.hanzo.team.
#
# GHCR push crosses into the hanzoai namespace, so login uses GH_PAT (hanzo-dev,
# write:packages), which exists as a hanzoai org secret on this forge.

permissions:
  contents: read
  packages: write

# Dispatch-only is what left hanzo.team on a July image wearing another host's
# name: the page was fixed in this tree and no container carried the fix,
# because shipping one needed a human to remember to type a version. cloud.yml
# learned this first; there is no reason the two hosts differ here.
#
# push cuts sha-<sha7>, which the estate's pin policy accepts beside a semver.
# It does NOT move the universe pin — team-www still runs whatever that pin
# names — so this makes a current image EXIST to pin rather than pretending the
# roll happened. Dispatch still takes an explicit X.Y.Z for a release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (X.Y.Z, next patch after the live universe pin)'
        required: true
        type: string

# Publishing an image is not cancellable work: a superseded run may already have
# pushed a layer under the tag it was given.
concurrency:
  group: team-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

env:
  # Build-record/summary artifact uploads can wedge on a full Actions
  # artifact quota and fail the push step; the image is what matters.
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build:
    runs-on: [hanzo-build-linux-amd64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # A dispatch names its release; a push names the commit it built from.
      # sha7 rather than the full sha is the estate's spelling — pins.py accepts
      # `sha-<sha7>` beside a semver.
      - name: Resolve the image tag
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "building ghcr.io/hanzoai/team-www:$tag"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      - name: Reset Docker credential store (runner hygiene)
        run: |
          mkdir -p "$HOME/.docker"
          printf '{}' > "$HOME/.docker/config.json"

      - name: Login to GHCR (GH_PAT — push into the hanzoai namespace)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: hanzo-dev
          password: ${{ secrets.GH_PAT }}

      # No KMS step, and no PUBLISHABLE_KEY passed: the key is DECLARED as the
      # Dockerfile's ARG default and in app/providers.tsx. A publishable key
      # ships in the client bundle by construction, so it is site identity
      # rather than a secret. Passing it here would only reintroduce the failure
      # this repo already had — a build arg reaches only the lanes that remember
      # it, and the lane that forgot cut keyless images.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ghcr.io/hanzoai/team-www:${{ env.IMAGE_TAG }}
          provenance: false
          push: true
          build-args: |
            SURFACE=team

      # build-push-action can exit 0 before the manifest resolves, so a green run
      # could still leave the pin naming a tag that ImagePullBackOffs. Prove it
      # pulls, and print the digest the universe pin has to carry — a tag bump
      # beside a stale digest reports the new tag and serves the old build.
      - name: Verify the pushed image resolves
        run: |
          set -euo pipefail
          img="ghcr.io/hanzoai/team-www:${{ env.IMAGE_TAG }}"
          for i in 1 2 3 4 5 6; do
            if docker buildx imagetools inspect "$img" >/dev/null 2>&1; then
              echo "resolved $img"
              docker buildx imagetools inspect "$img" --format '{{println .Manifest.Digest}}'
              exit 0
            fi
            echo "manifest not visible yet (attempt ${i}/6) — retrying"; sleep 5
          done
          echo "::error::pushed image never resolved: $img"; exit 1
