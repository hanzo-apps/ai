name: Sync from GitHub
# git.hanzo.ai is canonical; development also lands on
# github.com/hanzoai/hanzo.ai. ONE deterministic direction: an in-cluster PULL.
# The runner reaches both ends, so the sync has no ingress dependency.
#
# Fast-forward ONLY: a divergence fails loudly here instead of force-pushing
# either side.
#
# This replaces the forge's built-in pull mirror. A mirrored repo has
# has_actions=false — measured on this repo: mirror=true, has_actions=false,
# total_count=0 runs — so as long as it is a mirror, NOTHING in .hanzo/workflows
# can ever fire. Converting the repo to regular is what switches Actions on, and
# this job is what keeps it current afterwards.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: sync-from-github
  cancel-in-progress: false

jobs:
  ff-main:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fast-forward main from github.com/hanzoai/hanzo.ai
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          git fetch --quiet "https://x-access-token:${GH_PAT}@github.com/hanzoai/hanzo.ai.git" main
          LOCAL="$(git rev-parse HEAD)"; REMOTE="$(git rev-parse FETCH_HEAD)"
          if [ "$LOCAL" = "$REMOTE" ]; then echo "in sync at $LOCAL"; exit 0; fi
          if git merge-base --is-ancestor "$LOCAL" "$REMOTE"; then
            echo "fast-forwarding $LOCAL -> $REMOTE"
            git push origin "$REMOTE:refs/heads/main"
            # A push made with the workflow token does NOT trigger workflows, so
            # synced commits would never deploy. Dispatch explicitly.
            #
            # The path is /v1, NOT /api/v1: this forge mounts its API at /v1 —
            # /v1/version answers 200 and /api/v1/version answers 404 — which is
            # the same "no extraneous /api/ prefix" convention the rest of the
            # estate follows. Measured before trusting; the obvious-looking Gitea
            # default is wrong here.
            #
            # What WAS broken is the reporting. `-f` makes curl print nothing on
            # an HTTP error and `|| echo` turned the non-zero exit into a line of
            # output, so the step's worst case was the words "dispatch failed
            # (non-fatal)" — no status, no body, no URL. And it does not
            # self-heal: only the run that MOVES the ref reaches this line, since
            # every later run exits at "in sync" above, so a lost dispatch is
            # never retried.
            #
            # The status is captured and printed instead of swallowed. Still
            # non-fatal — the sync itself succeeded and must not be marked failed
            # — but the log now says what the server answered.
            d_url="${{ github.server_url }}/v1/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches"
            d_code=$(curl -sS --max-time 20 -o /tmp/dispatch.out -w '%{http_code}' -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              "$d_url" -d '{"ref":"main"}' || echo 000)
            case "$d_code" in
              2*) echo "deploy dispatched ($d_code)" ;;
              *)  echo "DISPATCH FAILED: HTTP $d_code from $d_url" >&2
                  head -c 400 /tmp/dispatch.out >&2 || true
                  echo >&2
                  echo "sync succeeded; this commit will NOT deploy until dispatched or pushed directly." >&2 ;;
            esac
          elif git merge-base --is-ancestor "$REMOTE" "$LOCAL"; then
            echo "canonical is AHEAD of GitHub — nothing to pull (never force from here)."
          else
            echo "::error::main DIVERGED between GitHub ($REMOTE) and canonical ($LOCAL) — refusing to force. Reconcile manually."
            exit 1
          fi
