name: Cloud

# Builds ghcr.io/hanzoai/cloud-www — the cloud.hanzo.ai marketing-site image the
# universe App CR `www` (infra/k8s/operator/crs/www.yaml) pins. Static export via
# Dockerfile.production, served by ghcr.io/hanzoai/static.
#
# Named cloud-www (matching the Deployment `www`) so it can NEVER collide with
# the backend Go binary image ghcr.io/hanzoai/cloud. Tag convention matches the
# live universe pin (X.Y.Z, e.g. 0.1.4 — next patch over the pinned tag).
#
# This replaces .github/workflows/cloud.yml. It last cut an image on 2026-07-25
# and could not have cut one since: it ran on `hanzo-apps-build-linux-amd64`, an
# ARC scale set decommissioned on 2026-07-27, and .github/workflows as a whole
# went dark on this forge once .hanzo/workflows existed. Same build, same
# registry, same credentials — only the runner label changed.
#
# GHCR push crosses into the hanzoai namespace, so login uses GH_PAT (hanzo-dev,
# write:packages), which exists as a hanzoai org secret on this forge.

permissions:
  contents: read
  packages: write

# Dispatch-only is why cloud.hanzo.ai served July for a month. deploy.yml ships
# the static site on every push, this shipped a container only when a human
# remembered to type a version, and nobody did -- so one repo served two builds
# of one page and the difference was invisible from either side.
#
# push now cuts sha-<sha7>, which is what the estate's pin policy already
# accepts alongside a semver. It does NOT move the universe pin: `www` still
# runs whatever that pin names, so this makes a current image EXIST to pin
# rather than pretending the roll happened. Dispatch still takes an explicit
# X.Y.Z for a release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (X.Y.Z, next patch after the live universe pin)'
        required: true
        type: string

# Publishing an image is not cancellable work: a superseded run may already have
# pushed a layer under the tag it was given.
concurrency:
  group: cloud-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

env:
  # Build-record/summary artifact uploads can wedge on a full Actions
  # artifact quota and fail the push step; the image is what matters.
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build:
    runs-on: [hanzo-build-linux-amd64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # One place the tag is decided, because three lines below consume it and
      # three answers is how a manifest ends up under a name nothing pinned.
      # A dispatch states its version; a push cannot invent one, so it publishes
      # the commit it built from. sha7 rather than the full sha is the estate's
      # spelling -- pins.py accepts `sha-<sha7>` beside a semver, and flow's
      # build cuts it the same way.
      - name: Resolve the image tag
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "building ghcr.io/hanzoai/cloud-www:$tag"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      - name: Reset Docker credential store (runner hygiene)
        run: |
          mkdir -p "$HOME/.docker"
          printf '{}' > "$HOME/.docker/config.json"

      - name: Login to GHCR (GH_PAT — push into the hanzoai namespace)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: hanzo-dev
          password: ${{ secrets.GH_PAT }}

      # No KMS step: the key is DECLARED, as the Dockerfile's ARG PUBLISHABLE_KEY
      # default and in app/providers.tsx. A publishable key ships in the client
      # bundle by construction, so it is site identity rather than a secret, and
      # fetching a value every visitor already holds bought nothing.
      #
      # It bought a failure mode instead. This lane once passed SITE_ROOT alone
      # and cut keyless images for exactly that reason: a build arg only reaches
      # the lanes that remember it. A default reaches every lane, this one
      # included, and the Dockerfile still refuses an explicitly empty value.
      #
      # The fetched key was also the org-wide one, which cloud files with product
      # empty; the declared project key arrives as product=hanzo-ai.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ghcr.io/hanzoai/cloud-www:${{ env.IMAGE_TAG }}
          provenance: false
          push: true
          build-args: |
            SITE_ROOT=cloud
            NEXT_PUBLIC_SURFACE=cloud

      # build-push-action can exit 0 before the manifest resolves, so a green run
      # could still leave the CR pinned to a tag that ImagePullBackOffs. Prove it
      # pulls before the job is green.
      - name: Verify the pushed image resolves
        run: |
          set -euo pipefail
          img="ghcr.io/hanzoai/cloud-www:${{ env.IMAGE_TAG }}"
          for i in 1 2 3 4 5 6; do
            if docker buildx imagetools inspect "$img" >/dev/null 2>&1; then
              echo "resolved $img"; exit 0
            fi
            echo "manifest not visible yet (attempt ${i}/6) — retrying"; sleep 5
          done
          echo "::error::pushed image never resolved: $img"; exit 1
