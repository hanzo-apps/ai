name: Cloud

# Builds ghcr.io/hanzoai/cloud-www — the cloud.hanzo.ai marketing-site image the
# universe App CR `www` (infra/k8s/operator/crs/www.yaml) pins. Static export via
# Dockerfile.production, served by ghcr.io/hanzoai/static.
#
# Named cloud-www (matching the Deployment `www`) so it can NEVER collide with
# the backend Go binary image ghcr.io/hanzoai/cloud. Tag convention matches the
# live universe pin (X.Y.Z, e.g. 0.1.4 — next patch over the pinned tag).
#
# This replaces .github/workflows/cloud.yml. It last cut an image on 2026-07-25
# and could not have cut one since: it ran on `hanzo-apps-build-linux-amd64`, an
# ARC scale set decommissioned on 2026-07-27, and .github/workflows as a whole
# went dark on this forge once .hanzo/workflows existed. Same build, same
# registry, same credentials — only the runner label changed.
#
# GHCR push crosses into the hanzoai namespace, so login uses GH_PAT (hanzo-dev,
# write:packages), which exists as a hanzoai org secret on this forge.

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (X.Y.Z, next patch after the live universe pin)'
        required: true
        type: string

# Publishing an image is not cancellable work: a superseded run may already have
# pushed a layer under the tag it was given.
concurrency:
  group: cloud-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # Build-record/summary artifact uploads can wedge on a full Actions
  # artifact quota and fail the push step; the image is what matters.
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build:
    runs-on: [hanzo-build-linux-amd64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      - name: Reset Docker credential store (runner hygiene)
        run: |
          mkdir -p "$HOME/.docker"
          printf '{}' > "$HOME/.docker/config.json"

      - name: Login to GHCR (GH_PAT — push into the hanzoai namespace)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: hanzo-dev
          password: ${{ secrets.GH_PAT }}

      # BEFORE the image build: NEXT_PUBLIC_* is inlined at build time, so the key
      # travels as a build-arg (Dockerfile ARG PUBLISHABLE_KEY) or never reaches
      # the bundle. deploy/PUBLISHABLE_KEY is the ONE name and ONE location in
      # KMS, shared with hanzo.app, hanzo.chat and this repo's own apex lane
      # (deploy.yml). This step was MISSING: every cloud-www image was built
      # keyless, and cloud refuses credential-less ingest — the $public tenant
      # that once caught keyless traffic is retired (cloud apps/analytics/
      # public.go), so the live landing answered 401 ingest_key_required on
      # every pageview and shipped a console error to every visitor.
      #
      # Absent is therefore a broken artifact, not a downgrade: no key, no image.
      - name: Fetch the ingest key from KMS
        id: kms
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://api.hanzo.ai' }}
          KMS_SECRET_ENV: ${{ vars.KMS_SECRET_ENV || 'prod' }}
        run: |
          set -euo pipefail
          token=$(curl -fsS "${KMS_ENDPOINT}/v1/kms/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"${KMS_CLIENT_ID}\",\"clientSecret\":\"${KMS_CLIENT_SECRET}\"}" \
            | jq -r '.accessToken // empty')
          if [ -z "${token}" ]; then
            echo "::error::KMS login failed at ${KMS_ENDPOINT}/v1/kms/auth/login"; exit 1
          fi
          key=$(curl -fsS "${KMS_ENDPOINT}/v1/kms/secrets/deploy/PUBLISHABLE_KEY?env=${KMS_SECRET_ENV}" \
            -H "Authorization: Bearer ${token}" | jq -r '.value // empty' || true)
          case "${key}" in
            pk-*) echo "::add-mask::${key}"; echo "key=${key}" >> "$GITHUB_OUTPUT" ;;
            *)    echo "::error::deploy/PUBLISHABLE_KEY absent or not pk- — a keyless image 401s every anonymous event; refusing to build"; exit 1 ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ghcr.io/hanzoai/cloud-www:${{ inputs.tag }}
          provenance: false
          push: true
          build-args: |
            SITE_ROOT=cloud
            PUBLISHABLE_KEY=${{ steps.kms.outputs.key }}

      # build-push-action can exit 0 before the manifest resolves, so a green run
      # could still leave the CR pinned to a tag that ImagePullBackOffs. Prove it
      # pulls before the job is green.
      - name: Verify the pushed image resolves
        run: |
          set -euo pipefail
          img="ghcr.io/hanzoai/cloud-www:${{ inputs.tag }}"
          for i in 1 2 3 4 5 6; do
            if docker buildx imagetools inspect "$img" >/dev/null 2>&1; then
              echo "resolved $img"; exit 0
            fi
            echo "manifest not visible yet (attempt ${i}/6) — retrying"; sleep 5
          done
          echo "::error::pushed image never resolved: $img"; exit 1
