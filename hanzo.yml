# Canonical CI/CD config for hanzo-apps/hanzo.ai — read by the shared
# hanzoai/ci reusable workflow (.hanzo/workflows/cicd.yml).
#
# hanzo.ai is a STATIC site (Next.js `output: export`). It ships to
# https://hanzo.ai via Cloudflare Pages in its OWN workflow (.hanzo/workflows/
# deploy.yml, CF creds from KMS) — NOT a container image. So there is no
# `images:` build and no operator `deploy:` here: the prior
# `ghcr.io/hanzoai/cloud-site` image was vestigial (unused by the live site) and,
# because this repo lives in the hanzo-apps org, its GITHUB_TOKEN cannot push to
# the hanzoai GHCR namespace — the push failed `denied: permission_denied` every
# run. Dropped.
#
# What remains is the gate the reusable runs on every push + PR. The reusable
# treats `images:` as optional (hanzoai/ci#8) and provisions Node for the JS test
# gate on the bare arc runner (hanzoai/ci#9), so this run is green with no
# cross-org push attempt.
#
# The `lint` step was DELETED for a while, and the reason it went is worth
# keeping: steps run in order, so a step that cannot pass is not a weak gate, it
# is a wall in front of the real one — and this one was standing in front of
# `gates`, contributing no signal and blocking all of it. It came back in the
# commit that made it pass, which is where it belonged. See its own note below.
test:
  # REPAIRED. Both breakages were real and stacked: `pnpm lint` was `next lint`,
  # which Next REMOVED in 16 (16.2.12 reads "lint" as a directory name and exits
  # 1), and underneath it typescript-eslint throws at IMPORT time against
  # TypeScript 7 — from the meta package and from @typescript-eslint/parser
  # alike — so calling eslint directly did not rescue it either. 8.66 still
  # declares `typescript: >=4.8.4 <6.1.0`; upstream scopes support to TS >= 7.1
  # (typescript-eslint#10940), so there is nothing to bump to.
  #
  # eslint.config.js now parses with @babel/eslint-parser, which reads the same
  # syntax without involving the TypeScript compiler and is therefore
  # indifferent to which major TypeScript is installed. Every
  # `@typescript-eslint/*` rule was already `off`, so the family was
  # contributing a parser and nothing else.
  #
  # Types are checked in two places, neither of them here: `pnpm typecheck`
  # (tsc 7, the native compiler, ~1.4s for the tree) and the build —
  # next.config.mjs sets neither `typescript.ignoreBuildErrors` nor
  # `eslint.ignoreDuringBuilds`, so `pnpm build` in the gates step below type
  # checks the whole tree and fails on an error.
  #
  # No pnpm or Node pin here, for the reason spelled out on `gates` below: each
  # is stated in exactly one place already, and a second copy is how they drift.
  - name: lint
    run: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm lint
  # The gates run against `out/` — the bytes that ship — because the two
  # defects they exist to catch were both invisible in the source that
  # produced them: `lineHeight={1.1}` reads as a ratio and compiles to
  # `line-height: 1.1px`, and a page nothing links to is still written into
  # sitemap.xml. A gate that read the source would have passed on both, so
  # the build is part of the gate and not a step before it.
  #
  # `gates`, not `test`: the older e2e specs drive a dev server on :8084 or
  # the live site, so they fail for reasons that are not the commit's.
  #
  # No pnpm version here. `packageManager` in package.json is the one place it
  # is stated, corepack reads it, and a second pin was BOTH wrong (it named
  # 10.33.4 against a 9.15.0 lockfile) and inert (corepack prefers the manifest).
  # `.github/workflows/deploy.yml` says the same thing by passing no `version:`.
  #
  # No Node version either, for the same reason: `.nvmrc` and `engines` name the
  # floor (22.18 — wrangler needs 22, and `scripts/noindex.mjs` reads
  # `lib/publish` directly, which needs the type stripping Node does for itself
  # from 22.18). If the reusable provisions something older this step fails on
  # the import, loudly, which is the right way for a floor to be wrong.
  - name: gates
    run: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm build
      pnpm exec playwright install --with-deps chromium
      pnpm gates
  # ONE design system, and this is what keeps it one. `hanzo-design-lint` ships
  # in @hanzo/design and every Hanzo surface runs the same twelve rules: eight
  # about writing a VALUE that should have been a token, and four about OWNING a
  # layer that should have been imported — a second `createGui` table, a second
  # publisher of a token this package declares, a local header or search control.
  # The four layers are values→@hanzo/design, structure→@hanzo/gui,
  # chrome→@hanzogui/shell, components→@hanzo/ui; a surface is data and layout.
  #
  # `hanzo-design.allow.json` is the ratchet: it states what this site still owes
  # per rule, and the number may only SHRINK. A violation written today fails
  # here. A count UNDER its allowance fails too, so a fix has to delete its own
  # exemption rather than leave room for the next author to regress into — the
  # same discipline `audit-catalog.mjs` holds its ratchet to, one step below.
  #
  # Needs the workspace (the binary is a dependency) and not the build.
  - name: one design system
    run: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm lint:design

  # A model's per-token price has one owner (the commerce catalog, published at
  # api.hanzo.ai/v1/pricing). This fails the build if a second copy is typed into
  # source, which is how this site came to advertise Enso BELOW what it charged.
  #
  # Deliberately NOT folded into `lint` or `gates`: both of those install the
  # workspace and build, and this needs neither — it only reads git-tracked
  # files. Kept separate, it reports even when an earlier step fails.
  - name: price literals
    run: node scripts/audit-price-literals.mjs

  # An `apiPath` in the commerce catalog is a promise that a reader who follows
  # the marketing page reaches a real operation. Nothing checked it, and 32 of
  # 84 products broke it — every one marked "enabled", every one a live 404.
  # e2e/catalog-agreement.spec.ts already ties this site to the catalog; this
  # ties the catalog to the document cloud actually serves, which is the link
  # that was missing. Same shape as the price gate: reads the network, never
  # fails the build when the network is absent, and its exemption list may only
  # shrink. Kept out of `gates` for the same reason as above — it needs no
  # workspace and no build.
  - name: catalog answers
    run: node scripts/audit-catalog.mjs

  # How many models we serve is the same class of fact as what they cost, and it
  # had drifted further: eighteen statements on this site in three different
  # numbers (100+, 130+, 400+), and 85+/200+/340 elsewhere in the estate. It now
  # derives from the same snapshot the prices come from. Same shape of gate, same
  # shrink-only ratchet, and it reads git-tracked files only.
  - name: model counts
    run: node scripts/audit-model-counts.mjs
